spring:
  # Perfil y configuración de la base de datos
  datasource:
    url: jdbc:h2:mem:middleware_metadata
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # Consola web de H2
  h2:
    console:
      enabled: true
      path: /h2-console

  # Configuración de JPA e Hibernate
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Inicialización mediante scripts SQL
  sql:
    init:
      mode: always