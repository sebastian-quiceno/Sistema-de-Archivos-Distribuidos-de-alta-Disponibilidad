services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dfsha-rabbitmq
    ports:
      - "5672:5672"   # Puerto AMQP para los Middlewares (MOM)
      - "15672:15672" # Panel web de administración (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

