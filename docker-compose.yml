services:
  database:
    image: postgres:16-alpine
    container_name: dfsha-database
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-metadata_database}
      POSTGRES_USER: ${DB_USER:-middleware_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-middlewarepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./metadata_DB:/docker-entrypoint-initdb.d:ro
    networks:
      - dfsha-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-middleware_admin} -d ${DB_NAME:-metadata_database}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dfsha-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dfsha-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: dfsha-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME:-metadata_database}?currentSchema=middleware
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-middleware_admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-middlewarepassword}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_AUTO_STARTUP: ${RABBITMQ_AUTO_STARTUP:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
      JWT_KEY: ${JWT_KEY:-sdan-dfs-ha-super-secret-jwt-key-2026-distributed-file-system-security}
      EXPIRATION_TIME: ${EXPIRATION_TIME:-86400000}
      MAX-FILE-SIZE: ${MAX_FILE_SIZE:-500MB}
      MAX-REQUEST-SIZE: ${MAX_REQUEST_SIZE:-500MB}
      CHUNK_SIZE: ${CHUNK_SIZE:-10485760}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-nodo-a}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    networks:
      - dfsha-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./ClientFrontEnd
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: dfsha-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dfsha-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  dfsha-network:
    driver: bridge
